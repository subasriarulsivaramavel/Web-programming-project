
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield | Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071426, #102c55, #432879);
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo span {
            color: #62e6c5;
        }

        .subtitle {
            text-align: center;
            color: #c4d2e8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #263c5e;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .tabs button.active {
            background: #62e6c5;
            color: #071426;
            font-weight: bold;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #526583;
            border-radius: 10px;
            background: #102440;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #62e6c5;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #62e6c5, #62b5ff);
            color: #071426;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: #aebed5;
            font-size: 12px;
            margin-top: 22px;
        }

        .hidden {
            display: none;
        }

        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: rgba(98, 230, 197, 0.12);
            color: #62e6c5;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="card">

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <div class="logo">🛡️ Scam<span>Shield</span></div>
        <p class="subtitle">Your digital safety starts here.</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active"
                    onclick="showForm('login')">
                Login
            </button>

            <button type="button" id="registerTab"
                    onclick="showForm('register')">
                Register
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" action="{{ url_for('login') }}" method="POST">

            <label for="loginEmail">Email address</label>
            <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button class="submit-btn" type="submit">
                Login →
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden"
              action="{{ url_for('register') }}" method="POST">

            <label for="name">Full name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
            >

            <label for="registerEmail">Email address</label>
            <input
                id="registerEmail"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="registerPassword">Create password</label>
            <input
                id="registerPassword"
                name="password"
                type="password"
                minlength="8"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
            >

            <button class="submit-btn" type="submit">
                Create Account →
            </button>
        </form>

        <p class="footer">
            🔒 Scam awareness. Smarter protection.
        </p>
    </div>

    <script>
        function showForm(type) {
            const isLogin = type === "login";

            document.getElementById("loginForm").classList.toggle(
                "hidden", !isLogin
            );

            document.getElementById("registerForm").classList.toggle(
                "hidden", isLogin
            );

            document.getElementById("loginTab").classList.toggle(
                "active", isLogin
            );

            document.getElementById("registerTab").classList.toggle(
                "active", !isLogin
            );
        }
    </script>
</body>
</html>
